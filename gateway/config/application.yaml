# Configuración del Gateway HCEN PoC: salud, puerto e importación de TLS.
# Las diferencias respecto de Plataforma se explican en README.md.

# Salud interna del contenedor. El cliente utiliza la base HTTPS /fhir.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  server:
    port: ${MANAGEMENT_PORT:8090}
    address: 127.0.0.1
server:
  port: 8080
  shutdown: graceful
spring:
  config:
    import: "optional:file:/config/tls-${SECURITY_MODE:none}.yaml"
